<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>七夕 · 徐香华 · 典藏</title>
  <style>
    /* ===== 全局重置 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #0d0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Georgia', 'Times New Roman', 'Songti SC', 'KaiTi', serif;
      padding: 20px;
      margin: 0;
      overflow-x: hidden;
      /* 细腻噪点纹理，增加质感 */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* ===== 主卡片 — 奢华毛玻璃 + 微光边框 ===== */
    .card {
      position: relative;
      max-width: 440px;
      width: 100%;
      background: rgba(20, 16, 14, 0.65);
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      border-radius: 56px;
      padding: 48px 30px 42px;
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.8),
        0 0 0 1px rgba(220, 200, 185, 0.06),
        inset 0 1px 0 rgba(255, 240, 230, 0.04);
      border: 1px solid rgba(255, 235, 220, 0.04);
      text-align: center;
      overflow: hidden;
      z-index: 1;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.4s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(220, 200, 185, 0.08);
    }

    /* ===== Canvas 动态流光粒子 ===== */
    #dynamicBg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      pointer-events: none;
      z-index: 0;
      opacity: 0.7;
    }

    /* ===== 所有内容浮在 Canvas 之上 ===== */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== 顶部装饰线 ===== */
    .top-ornament {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      opacity: 0.3;
    }
    .top-ornament .line {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200, 180, 165, 0.4), transparent);
    }
    .top-ornament .diamond {
      color: rgba(200, 180, 165, 0.5);
      font-size: 0.7rem;
      letter-spacing: 6px;
    }

    /* ===== 七夕标题 — 精致渐变 ===== */
    .festival-title {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 18px;
      font-family: 'KaiTi', '华文楷体', 'STKaiti', 'Georgia', serif;
      background: linear-gradient(135deg, #e8d5c0, #c8b0a0, #e8d5c0);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 8s ease-in-out infinite alternate;
      filter: drop-shadow(0 2px 12px rgba(180, 140, 120, 0.15));
      margin-bottom: 2px;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .sub-char {
      font-size: 0.8rem;
      letter-spacing: 12px;
      color: rgba(180, 165, 155, 0.5);
      font-weight: 300;
      margin-top: -2px;
      border-bottom: 1px solid rgba(200, 180, 165, 0.06);
      padding-bottom: 14px;
      width: 40%;
    }

    /* ===== 名字 — 雍容典雅 ===== */
    .name-wrapper {
      margin: 22px 0 14px;
      position: relative;
    }

    .name {
      font-size: 5.2rem;
      font-weight: 400;
      font-family: 'KaiTi', '华文楷体', 'STKaiti', 'Georgia', serif;
      line-height: 1.1;
      letter-spacing: 22px;
      background: linear-gradient(180deg, #f5ede6 20%, #d4c0b2 60%, #b8a092 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 4px 24px rgba(180, 140, 120, 0.15));
      animation: nameGlow 5s ease-in-out infinite alternate;
      transform: scale(1.02);
    }

    @keyframes nameGlow {
      0% { filter: drop-shadow(0 4px 24px rgba(180, 140, 120, 0.10)); }
      100% { filter: drop-shadow(0 4px 48px rgba(220, 180, 160, 0.25)); }
    }

    .name-ornament {
      font-size: 0.9rem;
      color: rgba(180, 165, 155, 0.25);
      letter-spacing: 28px;
      margin-top: -6px;
      font-weight: 300;
    }

    /* ===== 祝福语 — 高级磨砂质感 ===== */
    .bless {
      margin: 18px 0 16px;
      padding: 20px 16px;
      background: rgba(60, 48, 40, 0.20);
      border-radius: 60px;
      border: 1px solid rgba(220, 200, 185, 0.04);
      width: 100%;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 0 rgba(255, 240, 230, 0.02);
      position: relative;
      overflow: hidden;
    }

    /* 祝福语底纹光晕 */
    .bless::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 40%, rgba(200, 170, 150, 0.03), transparent 60%);
      pointer-events: none;
    }

    .bless p {
      font-size: 1.25rem;
      line-height: 1.9;
      color: rgba(235, 225, 215, 0.9);
      text-shadow: 0 2px 16px rgba(0, 0, 0, 0.3);
      letter-spacing: 5px;
      font-weight: 300;
      font-family: 'KaiTi', '华文楷体', 'STKaiti', 'Georgia', serif;
      position: relative;
      z-index: 1;
    }

    .bless em {
      font-style: normal;
      background: linear-gradient(135deg, #f0d5c0, #dbbcac);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 400;
    }

    .quote-line {
      font-size: 0.85rem;
      margin-top: 10px;
      color: rgba(180, 165, 155, 0.5);
      letter-spacing: 4px;
      border-top: 1px solid rgba(200, 180, 170, 0.04);
      padding-top: 12px;
      font-weight: 300;
      position: relative;
      z-index: 1;
    }

    /* ===== 分隔符 — 精致线条 ===== */
    .bridge-divider {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin: 12px 0 18px;
      opacity: 0.25;
    }
    .bridge-divider .line {
      height: 1px;
      width: 48px;
      background: linear-gradient(90deg, transparent, rgba(200, 180, 165, 0.3), transparent);
    }
    .bridge-divider .diamond {
      color: rgba(200, 180, 165, 0.4);
      font-size: 0.7rem;
      transform: rotate(45deg);
      display: inline-block;
      animation: diamondPulse 4s ease-in-out infinite;
    }
    @keyframes diamondPulse {
      0%, 100% { opacity: 0.2; transform: rotate(45deg) scale(1); }
      50% { opacity: 0.8; transform: rotate(45deg) scale(1.2); }
    }

    /* ===== 底部 — 精致极简 ===== */
    .footer-meta {
      margin-top: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      color: rgba(180, 165, 155, 0.4);
      font-size: 0.7rem;
      letter-spacing: 3px;
      padding: 10px 24px;
      border-radius: 40px;
      background: rgba(40, 32, 28, 0.15);
      border: 1px solid rgba(200, 180, 170, 0.02);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .footer-meta .date {
      font-family: 'Courier New', monospace;
      opacity: 0.6;
      font-weight: 300;
    }

    .footer-meta .sep {
      opacity: 0.15;
      font-weight: 100;
    }

    /* ===== 响应式适配 ===== */
    @media (max-width: 400px) {
      .card { padding: 32px 18px 30px; border-radius: 40px; }
      .name { font-size: 4.0rem; letter-spacing: 14px; }
      .festival-title { font-size: 1.3rem; letter-spacing: 12px; }
      .bless p { font-size: 1.05rem; letter-spacing: 4px; }
      .bless { padding: 16px 12px; }
    }

    @media (max-width: 360px) {
      .name { font-size: 3.2rem; letter-spacing: 10px; }
      .festival-title { font-size: 1.1rem; letter-spacing: 8px; }
    }

    /* ===== 点击涟漪 — 高级光晕 ===== */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(220, 200, 185, 0.10) 0%, transparent 70%);
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 1;
      animation: rippleAnim 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes rippleAnim {
      to { transform: translate(-50%, -50%) scale(10); opacity: 0; }
    }

    /* ===== 禁止选中 ===== */
    .card {
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <!-- Canvas 动态流光粒子背景 -->
    <canvas id="dynamicBg"></canvas>

    <!-- 内容层 -->
    <div class="content">
      <!-- 顶部装饰 -->
      <div class="top-ornament">
        <span class="line"></span>
        <span class="diamond">◆ ◇ ◆</span>
        <span class="line"></span>
      </div>

      <!-- 标题 -->
      <div class="festival-title">七 夕</div>
      <div class="sub-char">· 乞 巧 ·</div>

      <!-- 名字 -->
      <div class="name-wrapper">
        <div class="name">徐香华</div>
        <div class="name-ornament">— — —</div>
      </div>

      <!-- 祝福语 -->
      <div class="bless">
        <p>
          <em>✦</em> 星汉清浅，佳期如约 <em>✦</em><br>
          <span style="font-size: 1.1rem; letter-spacing: 8px; opacity: 0.3;">——</span><br>
          <span style="font-size: 1.0rem; opacity: 0.7;">愿流光寄去 一纸安暖</span>
        </p>
        <div class="quote-line">
          —— 七夕 · 徐香华 雅鉴 ——
        </div>
      </div>

      <!-- 分隔 -->
      <div class="bridge-divider">
        <span class="line"></span>
        <span class="diamond">◇</span>
        <span class="line"></span>
      </div>

      <!-- 底部 -->
      <div class="footer-meta">
        <span class="date">2026 · 七夕</span>
        <span class="sep">|</span>
        <span style="font-family: 'KaiTi'; opacity: 0.5; font-weight: 300;">徐香华</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ===== 动态流光 Canvas =====
      const canvas = document.getElementById('dynamicBg');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      const PARTICLE_COUNT = 80;

      // 高级调色板 — 琥珀/香槟/玫瑰金
      const palette = [
        { r: 200, g: 175, b: 155 },
        { r: 215, g: 190, b: 170 },
        { r: 180, g: 155, b: 140 },
        { r: 220, g: 200, b: 185 },
        { r: 160, g: 140, b: 125 },
        { r: 195, g: 170, b: 150 },
      ];

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        width = canvas.width;
        height = canvas.height;
        ctx.scale(1, 1);
        initParticles();
      }

      function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const color = palette[Math.floor(Math.random() * palette.length)];
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 3.0 + 1.2,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            color: color,
            alpha: Math.random() * 0.35 + 0.08,
            phase: Math.random() * Math.PI * 2,
            speed: 0.005 + Math.random() * 0.012,
          });
        }
      }

      function drawParticles() {
        ctx.clearRect(0, 0, width, height);

        for (let p of particles) {
          p.phase += p.speed;
          const alpha = p.alpha * (0.6 + 0.4 * Math.sin(p.phase));
          const { r, g, b } = p.color;

          // 外层光晕
          const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 4.5);
          gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.9})`);
          gradient.addColorStop(0.3, `rgba(${r}, ${g}, ${b}, ${alpha * 0.4})`);
          gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 4.5, 0, Math.PI * 2);
          ctx.fillStyle = gradient;
          ctx.fill();

          // 核心亮点
          ctx.shadowColor = `rgba(${r + 30}, ${g + 20}, ${b + 10}, ${alpha * 0.5})`;
          ctx.shadowBlur = 25;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 0.8, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${r + 40}, ${g + 30}, ${b + 20}, ${alpha * 0.8})`;
          ctx.fill();
          ctx.shadowBlur = 0;

          // 移动
          p.x += p.vx;
          p.y += p.vy;

          // 边界回环
          if (p.x < -30) p.x = width + 30;
          if (p.x > width + 30) p.x = -30;
          if (p.y < -30) p.y = height + 30;
          if (p.y > height + 30) p.y = -30;

          // 布朗运动
          p.vx += (Math.random() - 0.5) * 0.015;
          p.vy += (Math.random() - 0.5) * 0.015;
          const maxSpeed = 0.7;
          if (Math.abs(p.vx) > maxSpeed) p.vx = Math.sign(p.vx) * maxSpeed * 0.9;
          if (Math.abs(p.vy) > maxSpeed) p.vy = Math.sign(p.vy) * maxSpeed * 0.9;
        }

        // 极淡连线
        ctx.shadowBlur = 0;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
              const alpha = 0.04 * (1 - dist / 150);
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(200, 180, 165, ${alpha})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(drawParticles);
      }

      resizeCanvas();
      drawParticles();

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resizeCanvas, 200);
      });

      // ===== 点击涟漪 =====
      const card = document.getElementById('card');
      card.addEventListener('click', function(e) {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.style.width = '24px';
        ripple.style.height = '24px';
        card.appendChild(ripple);

        setTimeout(() => ripple.remove(), 900);
      });

    })();
  </script>
</body>
</html>
