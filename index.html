<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>七夕 · 徐香华 · 流光</title>
  <style>
    /* 全局重置 & 干净字体 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #1c1612;  /* 深色基底，衬托流光 */
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Georgia', 'Times New Roman', '宋体', 'KaiTi', serif;
      padding: 16px;
      margin: 0;
      overflow-x: hidden;
    }

    /* 主卡片 — 半透玻璃质感 + 动态光晕 */
    .card {
      position: relative;
      max-width: 440px;
      width: 100%;
      background: rgba(30, 24, 20, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 48px;
      padding: 44px 28px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(220, 200, 180, 0.1);
      border: 1px solid rgba(255, 235, 220, 0.08);
      transition: all 0.2s ease;
      text-align: center;
      overflow: hidden;
      z-index: 1;
    }

    /* 动态流光背景层 — 用canvas实现 */
    #dynamicBg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: inherit;
      pointer-events: none;
      z-index: 0;
      opacity: 0.7;
    }

    /* 所有内容浮在canvas之上 */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 七夕标题 — 渐变流光文字 */
    .festival-title {
      font-size: 2.0rem;
      font-weight: 300;
      letter-spacing: 14px;
      color: #f0e0d0;
      text-shadow: 0 0 20px rgba(200, 170, 150, 0.3);
      margin-bottom: 4px;
      font-family: 'KaiTi', '华文楷体', 'STKaiti', 'Georgia', serif;
      background: linear-gradient(135deg, #e8d5c0, #c8b0a0, #e0c8b8);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 6s ease-in-out infinite alternate;
      filter: drop-shadow(0 2px 8px rgba(180, 140, 120, 0.2));
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .sub-char {
      font-size: 0.95rem;
      letter-spacing: 8px;
      color: #b8a092;
      margin-top: -2px;
      font-weight: 300;
      opacity: 0.7;
      border-bottom: 1px solid rgba(200, 180, 165, 0.12);
      padding-bottom: 12px;
      width: 50%;
    }

    /* 名字 — 温润有光 */
    .name-wrapper {
      margin: 20px 0 12px;
      position: relative;
    }

    .name {
      font-size: 4.8rem;
      font-weight: 400;
      color: #f5ede6;
      text-shadow: 0 0 30px rgba(200, 160, 140, 0.25), 0 4px 20px rgba(0,0,0,0.4);
      letter-spacing: 18px;
      font-family: 'KaiTi', '华文楷体', 'STKaiti', 'Georgia', serif;
      line-height: 1.2;
      background: linear-gradient(180deg, #f5e8dd, #d4c0b2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 4px 12px rgba(160, 120, 100, 0.15));
      animation: softGlow 4s ease-in-out infinite alternate;
    }

    @keyframes softGlow {
      0% { filter: drop-shadow(0 4px 12px rgba(180, 140, 120, 0.1)); }
      100% { filter: drop-shadow(0 4px 28px rgba(220, 180, 160, 0.3)); }
    }

    .name-ornament {
      font-size: 1.2rem;
      color: #c0a898;
      letter-spacing: 24px;
      margin-top: -10px;
      font-weight: 300;
      opacity: 0.5;
    }

    /* 祝福语 — 半透磨砂 */
    .bless {
      margin: 18px 0 14px;
      padding: 18px 14px;
      background: rgba(60, 48, 40, 0.25);
      border-radius: 56px;
      border: 1px solid rgba(220, 200, 185, 0.06);
      width: 100%;
      backdrop-filter: blur(4px);
      box-shadow: inset 0 1px 0 rgba(255, 240, 230, 0.05);
    }

    .bless p {
      font-size: 1.3rem;
      line-height: 1.8;
      color: #e8dbd0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      letter-spacing: 4px;
      font-weight: 300;
      font-family: 'KaiTi', '华文楷体', 'STKaiti', 'Georgia', serif;
    }

    .bless em {
      font-style: normal;
      color: #e6cdbc;
      background: linear-gradient(135deg, #f0d5c0, #dbbcac);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 400;
    }

    .quote-line {
      font-size: 0.95rem;
      margin-top: 8px;
      color: #b8a59a;
      letter-spacing: 3px;
      border-top: 1px solid rgba(200, 180, 170, 0.08);
      padding-top: 10px;
      opacity: 0.7;
      font-weight: 300;
    }

    /* 分隔符 — 简约线条 + 菱光 */
    .bridge-divider {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 10px 0 16px;
      color: #c0aaa0;
      opacity: 0.4;
      font-size: 0.9rem;
      letter-spacing: 4px;
    }
    .bridge-divider .line {
      height: 1px;
      width: 40px;
      background: linear-gradient(90deg, transparent, #c0aaa0, transparent);
    }
    .bridge-divider .diamond {
      font-size: 1.0rem;
      opacity: 0.6;
      transform: rotate(45deg);
      display: inline-block;
      animation: diamondPulse 3s ease-in-out infinite;
    }
    @keyframes diamondPulse {
      0% { opacity: 0.3; transform: rotate(45deg) scale(1); }
      50% { opacity: 0.9; transform: rotate(45deg) scale(1.3); }
      100% { opacity: 0.3; transform: rotate(45deg) scale(1); }
    }

    /* 底部 — 精致 */
    .footer-meta {
      margin-top: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      color: #b8a69c;
      font-size: 0.8rem;
      letter-spacing: 2px;
      padding: 8px 20px;
      border-radius: 40px;
      background: rgba(40, 32, 28, 0.25);
      border: 1px solid rgba(200, 180, 170, 0.05);
      backdrop-filter: blur(2px);
    }

    .footer-meta .date {
      font-family: 'Courier New', monospace;
      opacity: 0.7;
      font-weight: 300;
    }

    .footer-meta .sep {
      opacity: 0.2;
      font-weight: 100;
    }

    /* 响应式 */
    @media (max-width: 400px) {
      .card { padding: 32px 16px 28px; }
      .name { font-size: 3.8rem; letter-spacing: 12px; }
      .festival-title { font-size: 1.6rem; letter-spacing: 10px; }
      .bless p { font-size: 1.1rem; }
    }

    /* 点击涟漪 — 优雅光晕 */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(220, 200, 185, 0.15) 0%, transparent 70%);
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 1;
      animation: rippleAnim 0.8s ease-out forwards;
    }
    @keyframes rippleAnim {
      to { transform: translate(-50%, -50%) scale(8); opacity: 0; }
    }

    /* 粒子爆炸效果 */
    .burst-particle {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 999;
      animation: burstOut 0.8s ease-out forwards;
    }
    @keyframes burstOut {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <!-- Canvas 动态流光背景 -->
    <canvas id="dynamicBg"></canvas>

    <!-- 内容层 (完全保留第三次对话的文本) -->
    <div class="content">
      <div class="festival-title">七 夕</div>
      <div class="sub-char">· 乞巧 ·</div>

      <div class="name-wrapper">
        <div class="name">徐香华</div>
        <div class="name-ornament">— — —</div>
      </div>

      <div class="bless">
        <p>
          <em>✦</em> 星汉清浅，佳期如约 <em>✦</em><br>
          <span style="font-size: 1.2rem; letter-spacing: 6px; opacity: 0.5;">——</span><br>
          <span style="font-size: 1.1rem; opacity: 0.8;">愿秋风寄去 一纸安暖</span>
        </p>
        <div class="quote-line">
          —— 七夕 · 徐香华 雅鉴 ——
        </div>
      </div>

      <div class="bridge-divider">
        <span class="line"></span>
        <span class="diamond">◇</span>
        <span class="line"></span>
      </div>

      <div class="footer-meta">
        <span class="date">2026 · 七夕</span>
        <span class="sep">|</span>
        <span style="font-family: 'KaiTi'; opacity: 0.6; font-weight: 300;">徐香华</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---------- 动态流光 Canvas (来自"流光幻彩"模板) ----------
      const canvas = document.getElementById('dynamicBg');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      const PARTICLE_COUNT = 90;

      // 颜色调色板 — 暖色流光 (紫粉金区间)
      const palette = [
        { r: 200, g: 140, b: 200 }, // 淡紫
        { r: 220, g: 160, b: 180 }, // 粉
        { r: 240, g: 200, b: 150 }, // 金
        { r: 180, g: 150, b: 220 }, // 紫蓝
        { r: 230, g: 180, b: 160 }, // 杏
      ];

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        width = canvas.width;
        height = canvas.height;
        ctx.scale(1, 1);
        initParticles();
      }

      function initParticles() {
        particles = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const color = palette[Math.floor(Math.random() * palette.length)];
          particles.push({
            x: Math.random() * width,
            y: Math.random() * height,
            radius: Math.random() * 3.5 + 1.5,
            vx: (Math.random() - 0.5) * 0.6,
            vy: (Math.random() - 0.5) * 0.6,
            color: color,
            alpha: Math.random() * 0.4 + 0.1,
            phase: Math.random() * Math.PI * 2,
            speed: 0.008 + Math.random() * 0.015,
          });
        }
      }

      function drawParticles() {
        ctx.clearRect(0, 0, width, height);

        for (let p of particles) {
          p.phase += p.speed;
          const alpha = p.alpha * (0.6 + 0.4 * Math.sin(p.phase));
          const { r, g, b } = p.color;

          // 主光晕
          const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 4);
          gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha * 0.8})`);
          gradient.addColorStop(0.4, `rgba(${r}, ${g}, ${b}, ${alpha * 0.3})`);
          gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 4, 0, Math.PI * 2);
          ctx.fillStyle = gradient;
          ctx.fill();

          // 核心亮点
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 0.7, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${Math.min(r+40, 255)}, ${Math.min(g+30, 255)}, ${Math.min(b+20, 255)}, ${alpha * 0.9})`;
          ctx.shadowColor = `rgba(${r}, ${g}, ${b}, ${alpha * 0.6})`;
          ctx.shadowBlur = 25;
          ctx.fill();

          // 移动粒子
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < -20) p.x = width + 20;
          if (p.x > width + 20) p.x = -20;
          if (p.y < -20) p.y = height + 20;
          if (p.y > height + 20) p.y = -20;

          p.vx += (Math.random() - 0.5) * 0.02;
          p.vy += (Math.random() - 0.5) * 0.02;
          const maxSpeed = 0.9;
          if (Math.abs(p.vx) > maxSpeed) p.vx = Math.sign(p.vx) * maxSpeed * 0.9;
          if (Math.abs(p.vy) > maxSpeed) p.vy = Math.sign(p.vy) * maxSpeed * 0.9;
        }

        // 极淡连线
        ctx.shadowBlur = 0;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 140) {
              const alpha = 0.08 * (1 - dist / 140);
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(200, 180, 200, ${alpha})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }

        requestAnimationFrame(drawParticles);
      }

      resizeCanvas();
      drawParticles();

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          resizeCanvas();
        }, 200);
      });

      // ---------- 点击涟漪效果 (保持原版优雅) ----------
      const card = document.getElementById('card');
      card.addEventListener('click', function(e) {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.style.width = '20px';
        ripple.style.height = '20px';
        card.appendChild(ripple);

        setTimeout(() => {
          ripple.remove();
        }, 800);

        // ---------- 新增：粒子爆炸效果 (来自"流光幻彩") ----------
        const colors = ['#ffb8d0', '#b8d8ff', '#f0d8a0', '#c8b0ff', '#ffa0b0', '#a0f0d0', '#f0c8b0'];
        for (let i = 0; i < 24; i++) {
          const el = document.createElement('div');
          el.className = 'burst-particle';
          const size = Math.random() * 8 + 4;
          el.style.width = size + 'px';
          el.style.height = size + 'px';
          el.style.background = colors[Math.floor(Math.random() * colors.length)];
          el.style.boxShadow = `0 0 20px ${el.style.background}`;
          el.style.left = e.clientX + 'px';
          el.style.top = e.clientY + 'px';
          const angle = Math.random() * 2 * Math.PI;
          const dist = Math.random() * 150 + 60;
          el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
          el.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
          el.style.animationDuration = (Math.random() * 0.6 + 0.4) + 's';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 1000);
        }
      });

      // 禁止选中文字
      card.style.userSelect = 'none';
      card.style.webkitUserSelect = 'none';
    })();
  </script>
</body>
</html>
